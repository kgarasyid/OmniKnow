<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Persebaran GraPARI</title>
<style>
:root { color-scheme:light; font:14px system-ui,sans-serif; color:#301921; background:#fff; --area-1:#ec003e; --area-2:#e36a00; --area-3:#008b78; --area-4:#6543cf; }
* { box-sizing:border-box; }
body { margin:0; }
header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
h2,h3,p { margin:0; }
h2 { font-size:clamp(21px,4vw,30px); color:#a6002a; }
header p { color:#754c58; margin-top:4px; }
button { font:inherit; cursor:pointer; }
button:focus-visible, summary:focus-visible { outline:3px solid #2c1645; outline-offset:2px; }
.controls { display:flex; flex-wrap:wrap; gap:6px; }
.controls button { min-height:36px; padding:6px 11px; border:1px solid #f3bac8; border-radius:8px; background:#fff; color:#a6002a; font-weight:700; }
.stage { position:relative; isolation:isolate; width:100%; max-height:390px; aspect-ratio:590/250; overflow:hidden; border:1px solid #ffd5df; border-radius:16px; background:radial-gradient(ellipse at 52% 42%,#fff 0%,#fff3f6 53%,#ffdde7 100%); }
.national-search { display:flex; align-items:end; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.national-search label { flex:1 1 210px; max-width:360px; margin:0; }
.national-search button, .national-match { min-height:38px; padding:6px 10px; border:1px solid #f3bac8; border-radius:7px; background:white; color:#940027; font:inherit; font-weight:700; }
.national-search button[type=submit] { background:#a6002a; border-color:#a6002a; color:white; }
.national-results { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 10px; }
.national-results:empty { display:none; }
.national-results p { font-size:12px; color:#754c58; }
.national-match[aria-pressed=true] { background:#fff1f5; border-color:#a6002a; }
.area-controls { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
[data-area="Area 1"] { --area-color:var(--area-1); }
[data-area="Area 2"] { --area-color:var(--area-2); }
[data-area="Area 3"] { --area-color:var(--area-3); }
[data-area="Area 4"] { --area-color:var(--area-4); }
.area-controls button { padding:6px 10px; border:1px solid color-mix(in srgb,var(--area-color,#a6002a) 40%,white); border-radius:7px; background:white; color:color-mix(in srgb,var(--area-color,#a6002a) 70%,black); font-weight:700; }
.area-controls button[aria-pressed="true"] { background:color-mix(in srgb,var(--area-color,#a6002a) 72%,black); color:white; }
.stage { min-height:300px; container-type:inline-size; }
.stage .region-pin .pin-count { font-size:14px; width:var(--cluster-size); height:var(--cluster-size); box-shadow:0 0 0 3px color-mix(in srgb,var(--area-color) 24%,transparent),0 3px 8px #280c2244; }
.stage .region-pin .region-label { font-size:10px; }
.cluster-leader { stroke:var(--area-color,#8e003b); stroke-opacity:.72; stroke-width:1; vector-effect:non-scaling-stroke; }
@container(max-width:650px) {
  .stage .region-pin .pin-count { width:23px; height:23px; font-size:10px; border-width:1px; }
  .stage .region-pin .region-label { display:none; }
  .stage .region-pin:is(:focus-visible,[aria-pressed=true],[data-dense]) .region-label { display:block; }
  .stage .region-pin[data-dense] .region-label { max-width:56px; font-size:9px; padding:2px 3px; }
}
.stage.has-selection .region-pin:not([aria-pressed=true], [data-match]) { opacity:.52; }
.stage.has-selection .cluster-leader:not(.is-active,.is-match) { opacity:.55; }
.stage .region-pin[aria-pressed=true] .pin-count { border:3px solid white; box-shadow:0 0 0 2px var(--area-color),0 0 0 5px #fff9,0 5px 12px #280c2255; }
.stage .region-pin[data-match]:not([aria-pressed=true]) .pin-count { outline:2px dashed var(--area-color); outline-offset:2px; }
.cluster-leader.is-active { stroke-opacity:.95; stroke-width:1.7; }
.stage svg { position:absolute; inset:0; width:100%; height:100%; }
.area-1 { fill:var(--area-1); }
.area-2 { fill:var(--area-2); }
.area-3 { fill:var(--area-3); }
.area-4 { fill:var(--area-4); }
.om-java { fill:url(#java-color); }
.om-land { stroke:#fff2f5; stroke-width:.55; }
.depth { filter:brightness(.62) saturate(1.2); }
.depth use { pointer-events:none; }
.map-pin { position:absolute; transform:translate(-50%,-85%); padding:5px 9px; min-height:29px; border:1px solid #b20033; border-radius:7px; background:#fff; color:#ad0030; font-weight:800; white-space:nowrap; box-shadow:0 3px 8px #82012734; }
.map-pin[aria-pressed="true"] { color:#fff; background:#be0034; border-color:#be0034; z-index:1; }
.region-pin { display:grid; justify-items:center; gap:3px; padding:0; border:0; background:none; box-shadow:none; transform:translate(-50%,-50%); white-space:normal; }
.region-pin[aria-pressed="true"] { color:#8b0028; background:none; z-index:4; }
.region-pin[hidden], .map-pin[hidden] { display:none; }
.region-pin .pin-count { display:grid; place-items:center; width:var(--cluster-size); height:var(--cluster-size); border:2px solid white; border-radius:50%; background:radial-gradient(circle at 35% 25%,color-mix(in srgb,var(--area-color) 75%,white),color-mix(in srgb,var(--area-color) 75%,black) 55%,color-mix(in srgb,var(--area-color) 62%,black)); color:white; font-size:clamp(15px,2.5vw,24px); box-shadow:0 0 0 5px color-mix(in srgb,var(--area-color) 24%,transparent),0 5px 12px #280c2255; }
.region-pin[aria-pressed="true"] .pin-count { box-shadow:0 0 0 5px color-mix(in srgb,var(--area-color) 40%,transparent),0 0 0 8px #fff8,0 5px 12px #280c2255; }
.region-pin .region-label { color:color-mix(in srgb,var(--area-color) 65%,black); font-size:11px; line-height:1.15; padding:3px 6px; border-radius:5px; background:#fffffff2; max-width:105px; }
.pin-icon { display:inline-flex; width:15px; height:18px; flex:none; color:#df003d; }
.pin-icon svg { position:static; width:100%; height:100%; fill:currentColor; }
li { display:flex; align-items:flex-start; gap:7px; }
@media(max-width:500px) { .region-pin .pin-count { width:calc(var(--cluster-size)*.75); height:calc(var(--cluster-size)*.75); } }
.branch-pin { position:absolute; display:grid; place-items:center; width:24px; height:24px; padding:3px; border:1px solid #a6002a; border-radius:50%; background:white; box-shadow:0 1px 3px #6b002b50; transform:translate(-50%,-95%); z-index:2; }
.branch-pin[hidden] { display:none; }
body.site-map[data-map-channel="Call Center"] {
  --map-accent:#14764b; --map-dark:#094630; --map-tint:#edf7f0; --map-edge:#cfe8d9;
}
body.site-map[data-map-channel="E-Care"] {
  --map-accent:#2b74ad; --map-dark:#1b365d; --map-tint:#edf5fc; --map-edge:#d2e5f5;
}
body.site-map .stage {
  border-color:var(--map-edge);
  background:radial-gradient(ellipse at 52% 42%,#fff 0%,var(--map-tint) 53%,var(--map-edge) 100%);
}
body.site-map :is(h2,header p,.note,.stage-legend,.controls button) { color:var(--map-dark); }
body.site-map .controls button { border-color:var(--map-edge); }
body.site-map .controls button:hover { background:var(--map-tint); }
.site-map :is(.national-search .branch-search,.national-results p) { color:var(--map-dark); }
.site-map :is(.national-search input,.national-search button,.national-match,.area-controls button) {
  border-color:var(--map-edge); color:var(--map-dark);
}
.site-map :is(.national-search button[type=submit],.area-controls button[aria-pressed=true]) {
  background:var(--map-dark); border-color:var(--map-dark); color:#fff;
}
.site-map .area-controls button:disabled { opacity:.55; cursor:default; }
.site-pin {
  position:absolute; display:grid; place-items:center; gap:2px; min-width:44px; padding:4px 7px;
  transform:translate(-50%,-100%); border:1px solid var(--map-accent); border-radius:8px;
  background:#fff; color:var(--map-dark); font-size:11px; font-weight:750; box-shadow:0 2px 6px #1b365d22;
}
.site-pin svg { position:static; width:22px; height:22px; }
.site-pin[aria-pressed=true] { background:var(--map-dark); color:#fff; border-color:var(--map-dark); }
.site-pin[hidden] { display:none; }
.site-leader { stroke:var(--map-dark); stroke-width:1.4; vector-effect:non-scaling-stroke; }
.site-anchor { fill:var(--map-dark); stroke:#fff; stroke-width:.8; vector-effect:non-scaling-stroke; }
.site-detail { margin:10px 0; min-height:20px; color:var(--map-dark); font-weight:650; }
.national-map :is(main > header,.national-search,.area-controls,.stage-legend) { display:none; }
.national-map .stage { background:radial-gradient(ellipse at 50% 37%,#fff 0%,#f3f7fc 58%,#e3edf7 100%); border-color:#ccddeb; }
.national-map-pin {
  position:absolute; transform:translate(-50%,-50%); color:#172e4f;
  padding:5px; border:1px solid #c4d8e6; border-radius:9px; background:#fff; box-shadow:0 2px 7px #1b365d28;
}
.national-map-pin[hidden] { display:none; }
.national-map-pin > span { display:block; text-align:center; font-size:11px; font-weight:800; margin-bottom:3px; }
.national-map-sites { display:flex; gap:4px; }
.national-map-filters { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:9px; }
.national-map-filters .national-map-button { min-height:36px; padding-inline:10px; font-size:12px; }
.national-map-filters [aria-pressed=true],.national-map-filters [aria-pressed=true]:hover {
  background:var(--pin-color); border-color:var(--pin-color); color:#fff;
}
.national-map-list { display:none; }
.national-map-button {
  --pin-color:#1b365d;
  display:inline-flex; align-items:center; gap:5px; min-height:32px; padding:4px 7px;
  border:1px solid color-mix(in srgb,var(--pin-color) 33%,#fff); border-radius:6px;
  background:#fff; color:var(--pin-color); font-size:11px; font-weight:800;
}
.national-map-button[hidden] { display:none; }
.national-map-button:hover { background:color-mix(in srgb,var(--pin-color) 8%,#fff); }
.national-map [data-channel="GraPARI"] { --pin-color:#b5002a; }
.national-map [data-channel="Call Center"] { --pin-color:#14764b; }
.national-map [data-channel="E-Care"] { --pin-color:#245f95; }
.national-map-button svg { position:static; width:17px; height:17px; flex:none; }
.national-map .site-anchor { fill:var(--pin-color,#1b365d); stroke-width:1.2; }
.national-map .site-leader { stroke:var(--pin-color,#1b365d); stroke-width:1.8; }
@media(max-width:620px) {
  .national-map .stage { min-height:0; aspect-ratio:590/275; }
  .national-map .national-map-pin,.national-map #cluster-leaders { display:none; }
  .national-map-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-top:8px; }
}
.branch-pin .pin-icon { color:var(--area-color); }
.branch-pin[aria-pressed="true"] { background:color-mix(in srgb,var(--area-color) 70%,black); z-index:3; }
.branch-pin[aria-pressed="true"] .pin-icon { color:white; }
.branch-pin:hover::after, .branch-pin:focus-visible::after, .branch-pin[aria-pressed="true"]::after { content:attr(aria-label); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:#7c0026; color:white; padding:5px 8px; border-radius:5px; width:max-content; max-width:150px; overflow-wrap:anywhere; font-size:12px; }
.branch-row { display:flex; flex-direction:column; align-items:flex-start; gap:3px; }
.branch-locate { border:0; padding:0; background:none; color:#a6002a; font:inherit; text-align:left; text-decoration:underline; }
.branch-locate[aria-pressed=true] { color:#730020; font-weight:750; }
.note { margin:8px 0 18px; color:#754c58; font-size:12px; }
.map-workspace { display:grid; gap:14px; align-items:start; }
.map-workspace.has-details { grid-template-columns:minmax(0,1fr) minmax(270px,340px); }
#area-details { min-width:0; padding:14px; border:1px solid #f3bac8; border-top:3px solid #e4003b; border-radius:12px; background:#fffafa; }
.branch-search { display:grid; gap:5px; margin-bottom:4px; color:#820029; font-size:12px; font-weight:700; }
.branch-search input { width:100%; min-height:38px; padding:7px 9px; border:1px solid #e9a6b7; border-radius:7px; font:inherit; color:#301921; background:white; }
#area-details .search-status { margin:5px 0 9px; font-size:12px; }
#area-details li[hidden] { display:none; }
@media(max-width:820px) { .map-workspace.has-details { grid-template-columns:minmax(0,1fr); } }
.map-detail-header { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.map-detail-close { border:1px solid #f3bac8; border-radius:6px; color:#9c0026; background:white; padding:3px 8px; }
.stage-legend { position:absolute; left:10px; top:10px; background:#fff9; border-radius:7px; padding:6px 8px; color:#820028; font-size:11px; pointer-events:none; }
#area-details details:not([open]) { display:none; }
#area-details details ul { grid-template-columns:1fr; max-height:340px; overflow:auto; }
#area-details summary { display:none; }

#area-details h3 { color:#a6002a; font-size:18px; }
#area-details p { margin:4px 0 12px; color:#754c58; }
.regions { display:grid; gap:8px; }
details { background:#fff5f7; border:1px solid #fad4de; border-radius:9px; overflow:clip; }
summary { padding:10px 12px; color:#920027; font-weight:750; cursor:pointer; }
summary span { margin-left:8px; font-size:12px; color:#754c58; }
ul { max-height:245px; overflow:auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr)); gap:0 18px; margin:0 12px 10px; padding:0; list-style:none; }
li { border-top:1px solid #f4dbe1; padding:6px 1px; overflow-wrap:anywhere; }
@media(max-width:500px) {
  .stage { aspect-ratio:590/285; }
  .map-pin { padding:4px 6px; min-height:28px; font-size:11px; }
}
</style>
</head>

<main>
<header>
  <div><h2>Persebaran GraPARI Indonesia</h2><p id="map-summary">Memuat daftar unit GraPARI…</p></div>
  <div class="controls" aria-label="Kontrol peta">
    <button type="button" data-action="left" aria-label="Putar ke kiri">↶</button>
    <button type="button" data-action="right" aria-label="Putar ke kanan">↷</button>
    <button type="button" data-action="reset">Peta Indonesia</button>
  </div>
</header>
<form class="national-search" id="national-search" role="search">
  <label class="branch-search"><span id="national-search-label">Cari GraPARI se-Indonesia</span>
    <input type="search" id="national-query" placeholder="Contoh: Makassar" autocomplete="off" required disabled>
  </label>
  <button type="submit" disabled>Cari</button>
  <button type="button" id="clear-national" hidden>Hapus</button>
</form>
<div class="national-results" id="national-results"></div>
<div class="area-controls" aria-label="Saring regional berdasarkan area">

  <button type="button" class="area-button" data-area="Area 1" aria-controls="area-details" aria-pressed="false" disabled>Area 1</button>
  <button type="button" class="area-button" data-area="Area 2" aria-controls="area-details" aria-pressed="false" disabled>Area 2</button>
  <button type="button" class="area-button" data-area="Area 3" aria-controls="area-details" aria-pressed="false" disabled>Area 3</button>
  <button type="button" class="area-button" data-area="Area 4" aria-controls="area-details" aria-pressed="false" disabled>Area 4</button>

<script>
const world = document.getElementById('world');
const mapQuery = new URLSearchParams(location.search);
const isNationalMap = mapQuery.get('view')==='national';
const siteChannels = new Map([['call-center','Call Center'],['e-care','E-Care']]);
const mapChannel = siteChannels.get(mapQuery.get('view')) || 'GraPARI';
const isSiteMap = mapChannel !== 'GraPARI';
const mapAreas = mapQuery.getAll('reportArea');
const mapAreaIncluded = area => !mapAreas.length || mapAreas.includes(mapChannel==='GraPARI' ? area : mapChannel);
function sendMapScope(mapArea='',mapRegion='',unit='',unitId='',activate=false) {
  if (parent!==window) parent.postMessage({type:'omniknow-map-scope',channel:mapChannel,mapArea,mapRegion,unit,unitId,activate},location.origin);
}
const areaButtons = Array.from(document.querySelectorAll('.area-button'));
const leaders = document.getElementById('cluster-leaders');
const stage = document.querySelector('.stage');
const mapDetails = document.getElementById('area-details');
const workspace = document.querySelector('.map-workspace');
const branchSearch = document.getElementById('branch-search');
const nationalSearch = document.getElementById('national-search');
const nationalQuery = document.getElementById('national-query');
const nationalResults = document.getElementById('national-results');
const clearNational = document.getElementById('clear-national');
let searchMatches = new Map();
const branchRows = new WeakMap();
const searchStatus = document.getElementById('branch-search-status');
let activeDetails;

function filterBranches() {
  if (!activeDetails) return;
  const query = branchSearch.value.trim().toLocaleLowerCase('id');
  let shown = 0;
  for (const row of activeDetails.querySelectorAll('li')) {
    row.hidden = !row.dataset.name.includes(query);
    if (!row.hidden) shown++;
  }
  const count = Number(activeDetails.dataset.count);
  searchStatus.textContent = query
    ? (shown ? shown + ' dari ' + count + ' cabang' : 'Nama cabang tidak ditemukan.')
    : count + ' cabang';
  activeDetails.querySelector('ul').scrollTop = 0;
}
branchSearch.addEventListener('input', filterBranches);
const legend = document.getElementById('stage-legend');
let detailTrigger;
mapDetails.querySelector('.map-detail-close').addEventListener('click', () => {
  mapDetails.hidden = true;
  workspace.classList.remove('has-details');
  activeDetails = null;
  drawMap();
  highlightRegion();
  detailTrigger?.focus({preventScroll:true});
});
const note = document.getElementById('map-note');
const regionalLocations = {
  Sumbagut:[111,72], Sumbagteng:[159,105], Sumbagsel:[190,154],
  'Jakarta dan Banten':[217,181], 'East Jakarta':[225,183], Jabar:[233,195],
  Jateng:[264,195], Jatim:[293,201], BaliNusra:[358,216],
  Kalimantan:[311,113], Sulawesi:[388,140], PapuaMaluku:[528,147],
};
const labelOffsets = {
  Sumbagut:[14,-13], Sumbagteng:[-1,-8], Sumbagsel:[-22,18],
  'Jakarta dan Banten':[-25,40], 'East Jakarta':[-1,-46], Jabar:[33,57],
  Jateng:[41,-21], Jatim:[48,43], BaliNusra:[43,16],
  Kalimantan:[10,-36], Sulawesi:[31,-15], PapuaMaluku:[16,-21],
};
const compactRegionLabels = {'Jakarta dan Banten':'Jakarta & Banten','East Jakarta':'East Jakarta',Jabar:'Jabar'};
const clusterLines = new Map();
const pinIcon = '<span class="pin-icon" aria-hidden="true"><svg viewBox="0 0 16 20"><path d="M8 0a8 8 0 0 0-8 8c0 5 8 12 8 12s8-7 8-12a8 8 0 0 0-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg></span>';
let regionPins = [];
let branchPins = [];
const sitePins = [];
const siteAnchors = new Map();
// City reference points, not office locations. GeoNames 1650357 and 1627896.
const mapCities = [
  {site:'Site 1',name:'Bandung',lat:-6.92222,lng:107.60694,offsetX:-43,offsetY:-12},
  {site:'Site 2',name:'Semarang',lat:-6.99306,lng:110.42083,offsetX:43,offsetY:-23},
];
let resetSiteMap;
let locations = {};
let angle = 0;
let directory;

function drawMap() {
  const radians = angle * Math.PI / 180;
  const tilt = .67;
  const a = Math.cos(radians), c = -Math.sin(radians);
  const b = -c*tilt, d = a*tilt;
  const matrix = new DOMMatrix([a,b,c,d,360-a*360-c*140,140-b*360-d*140]);
  world.setAttribute('transform', matrix.toString());
  for (const pin of [...regionPins, ...branchPins, ...sitePins]) {
    const point = matrix.transformPoint(new DOMPoint(Number(pin.dataset.x), Number(pin.dataset.y)));
    const anchor = {x:point.x,y:point.y};
    point.x += Number(pin.dataset.offsetX || 0);
    point.y += Number(pin.dataset.offsetY || 0);
    pin.hidden = pin.hasAttribute('data-channel-filtered') || point.x < 65 || point.x > 655 || point.y < 15 || point.y > 265;
    pin.style.left = (point.x-65)/590*100+'%';
    pin.style.top = (point.y-15)/250*100+'%';
    const line = clusterLines.get(pin);
    if (line) {
      line.style.display = pin.hidden ? 'none' : '';
      line.setAttribute('x1',anchor.x);
      line.setAttribute('y1',anchor.y);
      line.setAttribute('x2',point.x);
      line.setAttribute('y2',point.y);
    }
    const dot = siteAnchors.get(pin);
    if (dot) {
      dot.style.display = pin.hidden ? 'none' : '';
      dot.setAttribute('cx',anchor.x);
      dot.setAttribute('cy',anchor.y);
    }
  }
}

function countUnits(regions) {
  return Object.values(regions).reduce((sum, units) => sum + units.length, 0);
}

function projectLocation(location) {
  // Same equirectangular scale and origin as the embedded Natural Earth geometry.
  const scale = 12.0713345704767;
  return {x:-1065.5208777596604 + scale * location.lng, y:108.30574751917722 - scale * location.lat};
}

const normalizeUnit = name => String(name || '').trim().toLocaleLowerCase('id');
const mapNumber = new Intl.NumberFormat('id-ID');

async function readMapRoster(month,channelFilter=mapChannel) {
  const response = await fetch('/api/local-ask-summary');
  if (!response.ok) throw new Error('Data tidak tersedia');
  const months = await response.json();
  const period = /^\d{4}-(?:0[1-9]|1[0-2])$/.test(month || '') ? month : Object.keys(months).sort().at(-1);
  const units = Object.entries(months[period]?.csrLocations || {}).flatMap(([key,counts])=>{
    const [channel,area,region,id,unit] = JSON.parse(key);
    if ((channelFilter && channel!==channelFilter) || !unit || !mapAreaIncluded(area)) return [];
    return [{channel,area,region,id:String(id || ''),unit,count:Object.values(counts).reduce((sum,count)=>sum+count,0)}];
  });
  const periodLabel = period ? new Intl.DateTimeFormat('id-ID',{month:'long',year:'numeric',timeZone:'UTC'})
    .format(new Date(period+'-01T00:00:00Z')) : '';
  return {units,periodLabel,available:Boolean(months[period])};
}

function directoryWithWorkbook(source, workbook) {
  const areas = structuredClone(source);
  const index = new Map();
  const key = (area,region,unit)=>JSON.stringify([area,region,normalizeUnit(unit)]);
  for (const row of workbook) {
    if (!row.area || !row.region) continue;
    const names = ((areas[row.area] ||= {})[row.region] ||= []);
    if (!names.some(name=>normalizeUnit(name)===normalizeUnit(row.unit))) names.push(row.unit);
    const branchKey = key(row.area,row.region,row.unit);
    const matches = index.get(branchKey) || [];
    matches.push(row);
    index.set(branchKey,matches);
  }
  for (const [area,regions] of Object.entries(areas)) {
    for (const [region,names] of Object.entries(regions)) {
      regions[region] = names.flatMap(name=>{
        const matches = index.get(key(area,region,name));
        if (!matches) return [{unit:name,id:'',name,label:name,count:null}];
        return matches.map(row=>({...row,name,label:matches.length>1 ? `${name} · ID ${row.id || 'belum tercatat'}` : name}));
      });
    }
  }
  return areas;
}

function makeBranchPin(branch, location, details) {
  const point = projectLocation(location);
  const pin = document.createElement('button');
  pin.type = 'button';
  pin.className = 'branch-pin';
  pin.dataset.area = details.dataset.area;
  pin.dataset.region = details.dataset.region;
  pin.dataset.x = point.x;
  pin.dataset.y = point.y;
  pin.dataset.unit = branch.unit;
  pin.dataset.unitId = branch.id;
  pin.setAttribute('aria-label', branch.label);
  pin.setAttribute('aria-pressed', 'false');
  pin.insertAdjacentHTML('afterbegin', pinIcon);
  branchPins.push(pin);
  stage.append(pin);
  return pin;
}

function clearMapMarkers() {
  for (const marker of [...regionPins, ...branchPins]) marker.remove();
  regionPins = [];
  branchPins = [];
  clusterLines.clear();
  leaders.replaceChildren();
}

function highlightRegion(name) {
  stage.classList.toggle('has-selection', Boolean(name || searchMatches.size));
  for (const pin of regionPins) {
    const active = pin.dataset.region === name;
    const match = searchMatches.has(pin.dataset.region);
    pin.setAttribute('aria-pressed', String(active));
    pin.toggleAttribute('data-match',match);
    const line = clusterLines.get(pin);
    line?.classList.toggle('is-active',active);
    line?.classList.toggle('is-match',match);
  }
  for (const button of nationalResults.querySelectorAll('button')) {
    button.setAttribute('aria-pressed', String(button.dataset.region === name));
  }
}

function resetNationalSearch() {
  searchMatches.clear();
  nationalResults.replaceChildren();
  nationalQuery.value = '';
  clearNational.hidden = true;
}

function searchNational(event) {
  event.preventDefault();
  const raw = nationalQuery.value.trim();
  const query = raw.toLocaleLowerCase('id');
  if (!query || !directory) return;
  searchMatches = new Map(Object.values(directory).flatMap(regions => Object.entries(regions))
    .map(([region, units]) => [region, units.filter(({label}) => normalizeUnit(label).includes(query)).length])
    .filter(([, count]) => count > 0));
  showMap();
  const status = document.createElement('p');
  status.setAttribute('role','status');
  const total = [...searchMatches.values()].reduce((sum, count) => sum+count,0);
  status.textContent = total ? total + ' GraPARI di ' + searchMatches.size + ' regional' : 'Nama GraPARI tidak ditemukan.';
  const results = [...searchMatches].map(([name, count]) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'national-match';
    button.dataset.region = name;
    button.textContent = name + ' · ' + count;
    button.setAttribute('aria-pressed','false');
    button.addEventListener('click', () => {
      const pin = regionPins.find(pin => pin.dataset.region === name);
      if (pin) pin.click();
      else {
        const details = [...mapDetails.querySelectorAll('details')].find(row=>row.dataset.region===name);
        if (!details) return;
        openMapDetails(details,button);
        sendMapScope(details.dataset.area,name);
      }
      branchSearch.value = raw;
      filterBranches();
    });
    return button;
  });
  nationalResults.replaceChildren(status,...results);
  clearNational.hidden = false;
  results[0]?.click();
}

if (!isSiteMap) {
  nationalSearch.addEventListener('submit',searchNational);
  clearNational.addEventListener('click',() => {
    resetNationalSearch();
    showMap();
    nationalQuery.focus();
  });
}

function openMapDetails(details, marker) {
  detailTrigger = marker;
  if (activeDetails !== details) branchSearch.value = '';
  activeDetails = details;
  workspace.classList.add('has-details');
  for (const group of mapDetails.querySelectorAll('details')) group.open = group === details;
  mapDetails.hidden = false;
  highlightRegion(details.dataset.region);
  filterBranches();
  document.getElementById('selected-area').textContent = details.dataset.region;
  document.getElementById('area-count').textContent = details.dataset.count + ' unit GraPARI · ' + details.dataset.area;
}

function highlightBranch(details, button, pin, branch) {
  for (const marker of branchPins) marker.setAttribute('aria-pressed',String(marker===pin));
  for (const row of mapDetails.querySelectorAll('.branch-locate[aria-pressed="true"]')) row.setAttribute('aria-pressed','false');
  button.setAttribute('aria-pressed','true');
  openMapDetails(details,pin || regionPins.find(marker=>marker.dataset.region===details.dataset.region));
  document.getElementById('selected-area').textContent = branch.label;
  document.getElementById('area-count').textContent = [details.dataset.region,details.dataset.area,
    branch.count!==null ? `${mapNumber.format(branch.count)} CSR` : 'Jumlah CSR belum tersedia untuk bulan ini'].join(' · ');
  const list = details.querySelector('ul');
  const row = button.closest('li');
  if (row.hidden) return;
  const listBox = list.getBoundingClientRect();
  const rowBox = row.getBoundingClientRect();
  if (rowBox.bottom>listBox.bottom) list.scrollTop += rowBox.bottom-listBox.bottom;
}

function showMap(area = '') {
  const scope = area ? [[area, directory[area]]] : Object.entries(directory);
  for (const button of areaButtons) button.setAttribute('aria-pressed', String(button.dataset.area === area));
  note.textContent = 'Pilih bulatan regional, lalu klik nama unit untuk melihat distribusi ASK unit tersebut.';
  clearMapMarkers();
  mapDetails.hidden = true;
  workspace.classList.remove('has-details');
  activeDetails = null;
  const total = scope.reduce((sum, [, regions]) => sum + countUnits(regions), 0);
  legend.textContent = (area || 'Nasional') + ' · ' + total + ' GraPARI';
  const entries = scope.flatMap(([name, regions]) => Object.entries(regions).map(([region, units]) => [name, region, units]));
  const blocks = entries.map(([regionArea, name, units]) => {
    const details = document.createElement('details');
    details.dataset.region = name;
    details.dataset.area = regionArea;
    details.dataset.count = units.length;
    const marker = regionalLocations[name];
    if (marker) {
      const [x,y] = marker;
      const [offsetX,offsetY] = labelOffsets[name] ?? [0,0];
      const pin = document.createElement('button');
      pin.type = 'button';
      pin.className = 'map-pin region-pin';
      pin.dataset.area = regionArea;
      pin.dataset.region = name;
      pin.toggleAttribute('data-dense', Boolean(compactRegionLabels[name]));
      pin.dataset.x = x;
      pin.dataset.y = y;
      pin.dataset.offsetX = offsetX;
      pin.dataset.offsetY = offsetY;
      pin.setAttribute('aria-pressed', 'false');
      pin.setAttribute('aria-label', name + ', ' + units.length + ' GraPARI, lihat daftar cabang');
      pin.setAttribute('aria-controls', 'area-details');
      pin.style.setProperty('--cluster-size', Math.round(21 + Math.sqrt(units.length)*2.5) + 'px');
      const countLabel = document.createElement('span');
      countLabel.className = 'pin-count';
      countLabel.textContent = units.length;
      const label = document.createElement('span');
      label.className = 'region-label';
      label.textContent = compactRegionLabels[name] || name;
      pin.append(countLabel, label);
      pin.addEventListener('click', () => {
        for (const branch of branchPins) branch.setAttribute('aria-pressed', 'false');
        for (const row of mapDetails.querySelectorAll('.branch-locate[aria-pressed="true"]')) row.setAttribute('aria-pressed','false');
        openMapDetails(details, pin);
        sendMapScope(regionArea,name);
        if (window.matchMedia('(max-width:820px)').matches) mapDetails.scrollIntoView({block:'nearest'});
      });
      if (offsetX || offsetY) {
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.classList.add('cluster-leader');
        line.dataset.area = regionArea;
        clusterLines.set(pin,line);
        leaders.append(line);
      }
      regionPins.push(pin);
      stage.append(pin);
    }
    const summary = document.createElement('summary');
    const count = document.createElement('span');
    summary.textContent = name;
    count.textContent = units.length + ' unit';
    summary.append(count);
    const list = document.createElement('ul');
    for (const branch of units) {
      const item = document.createElement('li');
      item.dataset.name = normalizeUnit(branch.label);
      item.insertAdjacentHTML('afterbegin', pinIcon);
      const location = locations[branch.name] || locations[branch.unit];
      const copy = document.createElement('div');
      copy.className = 'branch-row';
      const hasPin = Number.isFinite(location?.lat) && Number.isFinite(location?.lng);
      const marker = hasPin ? makeBranchPin(branch,location,details) : null;
      const locate = document.createElement('button');
      locate.type = 'button';
      locate.className = 'branch-locate';
      locate.textContent = branch.label;
      locate.dataset.unit = branch.unit;
      locate.dataset.unitId = branch.id;
      locate.setAttribute('aria-pressed','false');
      branchRows.set(locate,{branch,marker});
      const select = ()=>{
        highlightBranch(details,locate,marker,branch);
        sendMapScope(regionArea,name,branch.unit,branch.id,true);
      };
      locate.addEventListener('click',select);
      marker?.addEventListener('click',select);
      copy.append(locate);
      item.append(copy);
      list.append(item);
    }
    details.append(summary, list);
    return details;
  });
  document.querySelector('.regions').replaceChildren(...blocks);
  highlightRegion();
  if (branchPins.length) note.textContent += ' Pin kecil menandai ' + branchPins.length + ' cabang dengan koordinat yang sudah dicocokkan.';
  drawMap();
}

for (const button of areaButtons) button.addEventListener('click', () => {
  resetNationalSearch();
  showMap(button.dataset.area);
  sendMapScope(button.dataset.area);
});
document.querySelector('.controls').addEventListener('click', ({target}) => {
  switch (target.dataset.action) {
    case 'left': angle = Math.max(-30,angle-6); break;
    case 'right': angle = Math.min(30,angle+6); break;
    case 'reset':
      angle = 0;
      if (isSiteMap) {
        resetSiteMap?.();
        drawMap();
      } else {
        resetNationalSearch();
        if (directory) showMap();
      }
      sendMapScope();
      return;
    default: return;
  }
  drawMap();
});
async function showSiteMap(month) {
  document.body.classList.add('site-map');
  document.body.dataset.mapChannel = mapChannel;
  document.title = 'Peta Persebaran '+mapChannel+' 3D';
  document.querySelector('h2').textContent = 'Persebaran '+mapChannel;
  const summary = document.getElementById('map-summary');
  summary.textContent = 'Memuat lokasi '+mapChannel+'…';
  document.getElementById('national-search-label').textContent = 'Cari unit '+mapChannel;
  nationalQuery.placeholder = 'Contoh: Bandung atau Site 2';
  document.querySelector('[data-action="reset"]').textContent = 'Semua lokasi';
  legend.textContent = 'Peta Indonesia';
  const isCare = mapChannel === 'E-Care';
  const iconLabel = isCare ? 'telepon' : 'tower';
  note.textContent = `Pilih ikon ${iconLabel} untuk melihat distribusi ASK unit ${mapChannel}. Titik menunjukkan lokasi kota.`;
  const detail = document.createElement('p');
  detail.className = 'site-detail';
  detail.setAttribute('role','status');
  detail.textContent = 'Semua lokasi '+mapChannel;
  stage.parentElement.after(detail);
  drawMap();

  const unitPrefix = isCare ? 'ecare ' : 'cc ';
  const cities = Object.fromEntries(mapCities.map(city=>[unitPrefix+city.name.toLowerCase(),city]));
  const siteControls = document.querySelector('.area-controls');
  siteControls.setAttribute('aria-label','Pilih site '+mapChannel);
  const siteButtons = new Map(['Semua site',...Object.values(cities).map(city=>city.site)].map(name=>{
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = name+' · 0';
    button.setAttribute('aria-pressed',String(name==='Semua site'));
    button.disabled = name!=='Semua site';
    return [name,button];
  }));
  siteControls.replaceChildren(...siteButtons.values());
  const selectSiteButton = name=>{
    for (const [site,button] of siteButtons) button.setAttribute('aria-pressed',String(site===name));
  };
  resetSiteMap = ()=>{
    resetNationalSearch();
    selectSiteButton('Semua site');
    for (const pin of sitePins) pin.setAttribute('aria-pressed','false');
    detail.textContent = 'Semua lokasi '+mapChannel;
  };
  siteButtons.get('Semua site').addEventListener('click',()=>{
    resetSiteMap();
    sendMapScope();
  });
  for (const {site} of Object.values(cities)) {
    siteButtons.get(site).addEventListener('click',()=>sitePins.find(pin=>pin.dataset.site===site)?.click());
  }
  const searchKey = text=>text.toLowerCase().replace(/[^a-z0-9]/g,'');
  nationalSearch.addEventListener('submit',event=>{
    event.preventDefault();
    const query = searchKey(nationalQuery.value);
    if (!query) return;
    const matches = sitePins.filter(pin=>[pin.dataset.unit,pin.dataset.site,pin.getAttribute('aria-label')]
      .some(value=>searchKey(value).includes(query)));
    const status = document.createElement('p');
    status.setAttribute('role','status');
    status.textContent = matches.length ? mapNumber.format(matches.length)+' unit ditemukan' : 'Unit '+mapChannel+' tidak ditemukan.';
    const buttons = matches.map(pin=>{
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'national-match';
      button.textContent = pin.dataset.site+' · '+pin.getAttribute('aria-label');
      button.addEventListener('click',()=>pin.click());
      return button;
    });
    nationalResults.replaceChildren(status,...buttons);
    clearNational.hidden = false;
  });
  clearNational.addEventListener('click',()=>{
    resetNationalSearch();
    nationalQuery.focus();
  });
  const markerPath = isCare
    ? '<path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a14 14 0 0 1-7-7l2-2-2-5Z"/>'
    : '<path d="m6 22 6-13 6 13M8 18h8M10 14h4M8.5 4.5a5 5 0 0 0 0 7m7-7a5 5 0 0 1 0 7M6 2a8.5 8.5 0 0 0 0 12m12-12a8.5 8.5 0 0 1 0 12"/><circle cx="12" cy="8" r="1"/>';
  try {
    const {units,periodLabel} = await readMapRoster(month);
    const mappedUnits = units.filter(({unit})=>Object.hasOwn(cities,normalizeUnit(unit)));
    if (!mappedUnits.length) {
      summary.textContent = 'Lokasi '+mapChannel+' belum tersedia untuk filter ini.';
      detail.textContent = '';
      return;
    }
    for (const {region,id,unit,count} of mappedUnits) {
      const city = cities[normalizeUnit(unit)];
      const point = projectLocation(city);
      const line = document.createElementNS(leaders.namespaceURI,'line');
      line.setAttribute('class','site-leader');
      const anchor = document.createElementNS(leaders.namespaceURI,'circle');
      anchor.setAttribute('class','site-anchor');
      anchor.setAttribute('r','2');
      leaders.append(line,anchor);
      const marker = document.createElement('button');
      marker.type = 'button';
      marker.className = 'site-pin';
      marker.dataset.x = point.x;
      marker.dataset.y = point.y;
      marker.dataset.offsetX = city.offsetX;
      marker.dataset.offsetY = city.offsetY;
      marker.dataset.unit = unit;
      marker.dataset.site = city.site;
      marker.setAttribute('aria-label',mapChannel+' '+city.name);
      const selected = mapQuery.get('unitId') ? mapQuery.get('unitId')===id
        : mapQuery.get('unit') ? normalizeUnit(mapQuery.get('unit'))===normalizeUnit(unit) : mapQuery.get('region')===region;
      marker.setAttribute('aria-pressed',String(selected));
      marker.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${markerPath}</svg>`;
      const label = document.createElement('span');
      label.textContent = city.name;
      marker.append(label);
      const caption = mapChannel+' '+city.name+' · '+mapNumber.format(count)+' CSR · '+periodLabel;
      if (selected) {
        detail.textContent = caption;
        selectSiteButton(city.site);
      }
      marker.addEventListener('click',()=>{
        for (const pin of sitePins) pin.setAttribute('aria-pressed',String(pin===marker));
        selectSiteButton(city.site);
        detail.textContent = caption;
        sendMapScope('',region,unit,id,true);
      });
      sitePins.push(marker);
      clusterLines.set(marker,line);
      siteAnchors.set(marker,anchor);
      stage.append(marker);
    }
    for (const [site,button] of siteButtons) {
      const count = site==='Semua site' ? sitePins.length : sitePins.filter(pin=>pin.dataset.site===site).length;
      button.textContent = site+' · '+mapNumber.format(count);
      button.disabled = site!=='Semua site' && count===0;
    }
    nationalQuery.disabled = false;
    nationalSearch.querySelector('[type=submit]').disabled = false;
    summary.textContent = mappedUnits.length+' unit · '+periodLabel;
    if (sitePins.length<units.length) note.textContent += ' '+(units.length-sitePins.length)+' unit belum memiliki titik kota.';
    drawMap();
  } catch {
    summary.textContent = 'Data '+mapChannel+' lokal belum bisa dimuat.';
    detail.textContent = '';
  }
}

async function showNationalMap(month) {
  document.body.classList.add('national-map');
  document.title = 'Peta Sebaran CTP Nasional';
  const paths = {
    GraPARI:'M4 21h16M6 21V4h12v17M10 21v-4h4v4M9 8h1m4 0h1M9 12h1m4 0h1',
    'Call Center':'M4 10V9a8 8 0 0 1 16 0v1M4 10h2v5H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Zm16 0h-2v5h2a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1Zm-4 5a2 2 0 0 1-2 2h-2',
    'E-Care':'M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm3 14.5h2',
  };
  const icon = channel=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[channel]}"/></svg>`;
  const filters = document.createElement('div');
  filters.className = 'national-map-filters';
  filters.setAttribute('role','group');
  filters.setAttribute('aria-label','Filter kanal peta');
  workspace.before(filters);
  const list = document.createElement('div');
  list.className = 'national-map-list';
  workspace.after(list);
  const targetButton = (channel,target,label,description)=>{
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'national-map-button';
    button.dataset.channel = channel;
    button.setAttribute('aria-label',description);
    button.title = description;
    button.innerHTML = icon(channel);
    button.append(label);
    button.addEventListener('click',()=>{
      if (parent!==window) parent.postMessage({type:'omniknow-national-map-open',channel,target},location.origin);
    });
    return button;
  };
  const placePin = (pin,x,y,offsetX,offsetY,channel='')=>{
    Object.assign(pin.dataset,{x,y,offsetX,offsetY,channel});
    pin.className = 'national-map-pin';
    const line = document.createElementNS(leaders.namespaceURI,'line');
    line.setAttribute('class','site-leader');
    line.dataset.channel = channel;
    const anchor = document.createElementNS(leaders.namespaceURI,'circle');
    anchor.setAttribute('class','site-anchor');
    anchor.setAttribute('r','3.2');
    anchor.dataset.channel = channel;
    leaders.append(line,anchor);
    clusterLines.set(pin,line);
    siteAnchors.set(pin,anchor);
    sitePins.push(pin);
    stage.append(pin);
  };
  const roster = await readMapRoster(month,'').catch(()=>({units:[],available:false,periodLabel:''}));
  const areas = [[148,102,17,-30],[224,197,-28,43],[341,202,14,34],[471,122,20,-28]];
  areas.forEach(([x,y,offsetX,offsetY],index)=>{
    const area = 'Area '+(index+1);
    const units = new Set(roster.units.filter(row=>row.channel==='GraPARI' && row.area===area)
      .map(row=>row.id || normalizeUnit(row.unit)));
    const count = roster.available ? mapNumber.format(units.size)+' unit' : 'Jumlah unit belum tersedia';
    const pin = document.createElement('div');
    pin.append(targetButton('GraPARI',area,roster.available ? area+' · '+count : area,'GraPARI '+area+' · '+count));
    placePin(pin,x,y,offsetX,offsetY,'GraPARI');
    list.append(targetButton('GraPARI',area,roster.available ? area+' · '+count : area,'GraPARI '+area+' · '+count));
  });
  for (const [index,city] of mapCities.entries()) {
    const pin = document.createElement('div');
    const label = document.createElement('span');
    label.textContent = city.name;
    const buttons = document.createElement('div');
    buttons.className = 'national-map-sites';
    for (const channel of ['Call Center','E-Care']) {
      const description = channel+' · '+city.site+' '+city.name;
      buttons.append(targetButton(channel,city.site,'',description));
      list.append(targetButton(channel,city.site,channel+' '+city.name,description));
    }
    pin.append(label,buttons);
    const {x,y} = projectLocation(city);
    placePin(pin,x,y,index===0?-28:42,index===0?-30:-53);
  }
  for (const channel of ['',...Object.keys(paths)]) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'national-map-button';
    button.dataset.channel = channel;
    button.setAttribute('aria-pressed',String(!channel));
    if (channel) button.innerHTML = icon(channel);
    button.append(channel || 'Semua CTP');
    button.addEventListener('click',()=>{
      for (const option of filters.children) option.setAttribute('aria-pressed',String(option===button));
      for (const pin of sitePins) {
        const targets = Array.from(pin.querySelectorAll('button'));
        for (const target of targets) target.hidden = Boolean(channel && target.dataset.channel!==channel);
        pin.toggleAttribute('data-channel-filtered',targets.every(target=>target.hidden));
        clusterLines.get(pin).dataset.channel = siteAnchors.get(pin).dataset.channel = pin.dataset.channel || channel;
      }
      for (const target of list.children) target.hidden = Boolean(channel && target.dataset.channel!==channel);
      drawMap();
    });
    filters.append(button);
  }
  note.textContent = (roster.periodLabel ? 'Jumlah unit dari roster '+roster.periodLabel+'. ' : '') +
    'Pilih area GraPARI atau ikon site untuk membuka tab terkait.';
  drawMap();
}

if (isNationalMap) {
  showNationalMap(mapQuery.get('month'));
} else if (isSiteMap) {
  showSiteMap(mapQuery.get('month'));
} else {
  drawMap();
  const locationsRequest = fetch('/api/local-grapari-locations')
    .then(response => response.ok ? response.json() : {})
    .catch(() => ({}));
  const directoryRequest = fetch('/api/local-grapari').then(response => {
    if (!response.ok) throw new Error('Data GraPARI tidak tersedia');
    return response.json();
  });
  const rosterRequest = readMapRoster(mapQuery.get('month')).catch(()=>({units:[]}));
  Promise.all([directoryRequest, locationsRequest, rosterRequest]).then(([data, branchLocations, roster]) => {
    directory = directoryWithWorkbook(Object.fromEntries(Object.entries(data).filter(([area])=>mapAreaIncluded(area))),roster.units);
    locations = branchLocations;
    nationalQuery.disabled = false;
    nationalSearch.querySelector('[type=submit]').disabled = false;
    const areas = Object.values(directory);
    const total = areas.reduce((sum, regions) => sum + countUnits(regions), 0);
    for (const button of areaButtons) {
      const area = button.dataset.area;
      const count = area ? (directory[area] ? countUnits(directory[area]) : 0) : total;
      button.disabled = area ? !directory[area] : !areas.length;
      if (!button.disabled) button.textContent += ' · ' + mapNumber.format(count);
    }
    const regional = areas.reduce((sum, regions) => sum + Object.keys(regions).length, 0);
    document.getElementById('map-summary').textContent = total + ' unit · ' + areas.length + ' area · ' + regional + ' regional';
    const area = mapQuery.get('area');
    const region = mapQuery.get('region');
    const unit = mapQuery.get('unit');
    const unitId = mapQuery.get('unitId');
    showMap(directory[area] ? area : '');
    const group = [...mapDetails.querySelectorAll('details')].find(details=>details.dataset.region===region &&
      (!area || details.dataset.area===area));
    if (group) {
      const button = unit && [...group.querySelectorAll('.branch-locate')].find(row=>unitId
        ? row.dataset.unitId===unitId : normalizeUnit(row.dataset.unit)===normalizeUnit(unit));
      if (button) {
        const {branch,marker} = branchRows.get(button);
        highlightBranch(group,button,marker,branch);
      } else openMapDetails(group,regionPins.find(pin=>pin.dataset.region===region));
    }
  }).catch(() => {
    document.getElementById('map-summary').textContent = 'Daftar unit GraPARI lokal tidak tersedia.';
  });
}
</script>
