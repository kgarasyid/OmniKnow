ing disabled.'}</p><button class="btn" data-goto="4">Inspect BCSA</button></div></div></div>`}function askExcelLogic(a){const A=askNumeric(a.attitude),S=askNumeric(a.skill),K=askNumeric(a.knowledge);if(![A,S,K].every(Number.isFinite))return {levels:['—','—','—'],quadrant:'Needs data',recommendation:'Needs data',score:null,talent:'Needs data'};const ha=A>=80,hs=S>=80,hk=K>=80;const levels=[ha?'High Attitude':'Low Attitude',hs?'High Skill':'Low Skill',hk?'High Knowledge':'Low Knowledge'];const key=[ha,hs,hk].map(v=>v?'H':'L').join('');const quad={HHH:'HAHAKO (HA)',HHL:'HALOKO (HA)',HLL:'LOLOKO (HA)',LHH:'HAHAKO (LA)',LLL:'LOLOKO (LA)',LHL:'HALOKO (LA)',HLH:'LOHAKO (HA)',LLH:'LOHAKO (LA)'}[key];const rec={'HAHAKO (HA)':'Dipertahankan','HALOKO (HA)':'++ Knowledge','HALOKO (LA)':'++ Knowledge, Attitude','HAHAKO (LA)':'++ Attitude','LOHAKO (HA)':'++ Skill','LOHAKO (LA)':'++ Skill, Attitude','LOLOKO (LA)':'++ Skill, Knowledge, Attitude','LOLOKO (HA)':'++ Skill, Knowledge'}[quad]||'Needs review';const score=0.4*A+0.3*S+0.3*K;let talent=score>=80?'Excellent Performance':score>=70?'Good Performance':score>=60?'Core Performance':'Growth Potential';if(['Non Agent','CS SAR'].includes(a.askRole||a.job||a.JOB))return {levels,quadrant:'Non Kuadran',recommendation:'Non Kuadran',score,talent};return {levels,quadrant:quad,recommendation:rec,score,talent}}function agentTable(xs,showAsk=false){let rows=sortAgents(xs,showAsk?'ask':'training');if(showAsk){return `<div class="tablewrap"><table><thead><tr><th>${sortBtn('ask','name','Agent')}</th><th>${sortBtn('ask','id','ID / NIK')}</th><th>${sortBtn('ask','areaRegion','Area / Region')}</th><th>${sortBtn('ask','ctp','CTP')}</th><th>${sortBtn('ask','attitude','Attitude')}</th><th>${sortBtn('ask','skill','Skill')}</th><th>${sortBtn('ask','knowledge','Knowledge')}</th><th>${sortBtn('ask','levelAttitude','Level Attitude')}</th><th>${sortBtn('ask','levelSkill','Level Skill')}</th><th>${sortBtn('ask','levelKnowledge','Level Knowledge')}</th><th>$ function monthShort(dateStr){const d=new Date(dateStr);return isNaN(d)?'Unknown':d.toLocaleString('en-US',{month:'long'});}function askMixMode(a){let ix=parseInt(String(a.id).replace(/\D/g,''))||1;return ix%2===0?'Offline':'Online'}function askKpiCard(label,value,note,accent,delta,unit="pts"){return `<div class="ask-stat-card" style="--accent:${accent}"><div class="ask-stat-label">${label}</div><div class="ask-stat-value">${value}</div><div class="ask-stat-note">${note}</div><div class="ask-stat-mom">${fmtDiff(delta,unit,unit==="agents"?0:1)}<span class="ask-stat-mini">${sparkline(delta,label+" "+trendMeta().label)}</span></div></div>`}function askBarChart(rows,opts={}){let max=Math.max(...rows.map(r=>r.value),1),cls=opts.cls||'',height=opts.height||170;return `<div class="ask-bars ${cls}">${rows.map(r=>`<div class="ask-bar-item"><div class="ask-bar-wrap" style="height:${height}px"><div class="ask-bar ${r.className||''}" style="height:${Math.max(6,(r.value/max)*height)}px"></div></div><div class="ask-bar-value">${r.display||r.value}</div><div class="ask-bar-label">${el(r.label)}</div></div>`).join('')}</div>`}function askHBarChart(rows){let max=Math.max(...rows.map(r=>r.value),1);return `<div class="ask-hbars">${rows.map(r=>`<div class="ask-hrow"><div class="ask-hlabel">${el(r.label)}</div><div class="ask-htrack"><div class="ask-hfill" style="width:${(r.value/max)*100}%"></div></div><div class="ask-hvalue">${r.display||r.value}</div></div>`).join('')}</div>`}function askDonutChart(rows,total,title){let r=54,c=2*Math.PI*r,p1=rows[0]?.value||0,p2=rows[1]?.value||0,a1=total?360*(p1/total):0,off1=0,off2=-(c*(p1/Math.max(total,1)));return `<div class="ask-donut-layout"><svg class="ask-donut" viewBox="0 0 160 160" style="--a1:${a1}"><circle class="bg" cx="80" cy="80" r="54"></circle><circle data-chart-tip="${el((rows[0]?.label||'Series 1')+': '+p1+' ('+pct(p1,total)+'%)')}" class="fg1" cx="80" cy="80" r="54" stroke-dasharray="${c*(p1/Math.max(total,1))} ${c}" stroke-dasho ust','September','October'],monthRows=months.map((m,i)=>({label:m,value:xs.filter(a=>monthShort(state.activities[i%Math.max(state.activities.length,1)]?.date||'2026-10-01')===m).length||xs.filter(a=>parseInt(String(a.id).replace(/\D/g,''))%3===i).length})),regionRows=ALL_REGIONS.map(r=>({label:r,value:xs.filter(a=>a.region===r).length})).filter(r=>r.value>0).sort((a,b)=>b.value-a.value).slice(0,10),mixRows=['Offline','Online'].map((m,i)=>({label:m,value:xs.filter(a=>askMixMode(a)===m).length,color:i===0?'#1B4F8A':'#374151'})),areaRows=['Area 1','Area 2','Area 3','Area 4'].map(a=>({label:a,value:xs.filter(x=>x.area===a).length})).filter(r=>r.value>0).sort((a,b)=>b.value-a.value),scoreRows=[{label:'Attitude',value:avg(xs.map(a=>a.attitude)),display:avg(xs.map(a=>a.attitude)).toFixed(1),className:'attitude'},{label:'Skill',value:avg(xs.map(a=>a.skill)),display:avg(xs.map(a=>a.skill)).toFixed(1),className:'skill'},{label:'Knowledge',value:avg(xs.map(a=>a.knowledge)),display:avg(xs.map(a=>a.knowledge)).toFixed(1),className:'knowledge'},{label:'ASK Total',value:avgAsk,display:avgAsk.toFixed(1),className:'overall'}];return `<div class="ask-visual-suite"><div class="ask-kpi-grid">${askKpiCard('Total Participants',total,`${category==='All Categories'?'Agents in current scope':category+' linked agents'} · current filter`,'#1B4F8A',momMetric(xs,a=>a.length),'agents')}${askKpiCard('Unique NIK',unique,'Unique demo agent records in current scope','#6B7280',momMetric(xs,a=>new Set(a.map(x=>x.id)).size),'agents')}${askKpiCard('Average Post-Test',total?avgPost.toFixed(1):'—','Average post-test result out of 100','#C8202E',momMetric(xs,a=>meanField(a,x=>x.post)))}${askKpiCard('Average Total ASK',total?avgAsk.toFixed(1):'—','Mean of Attitude, Skill, and Knowledge','#374151',momMetric(xs,a=>meanField(a,x=>(x.attitude+x.skill+x.knowledge)/3)))}</div><div class="ask-viz-grid"><div class="ask-viz-card"><h3>Participants by Month</h3><p class="small">Illustrative distribution for current fi
